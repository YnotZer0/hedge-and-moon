<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedge &amp; Moon</title>
<meta name="description" content="A UK herb garden calendar, evidence-checked remedies, recipes for one, a journal and herb stores.">
<meta name="theme-color" content="#16131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hedge &amp; Moon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=IM+Fell+English:ital@0;1&family=Karla:wght@400;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: a single-column phone app — sticky header, scrolling page, fixed tab bar.
   Moonlit herbarium: blackberry-ink night with parchment type, foxglove and brass accents.
   Day theme is a pale sage herbarium sheet. */
:root {
  --bg: #16131c;
  --surface: #1f1a27;
  --surface-2: #29233a;
  --line: #3a3149;
  --fg: #ede6da;
  --muted: #a99fb3;
  --accent: #e0a2c6;
  --accent-ink: #1b1120;
  --brass: #d9b56f;
  --moss: #9cc28f;
  --good: #8fcf9c;
  --warn: #e8b85c;
  --danger: #ec8375;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --stroke-art: rgba(237,230,218,.5);
  --font-display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Karla", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --tabbar-h: 64px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceee4; --surface: #f8f8f2; --surface-2: #e2e6d8; --line: #cdd2c0;
    --fg: #261e2c; --muted: #655c6c; --accent: #9b3f76; --accent-ink: #fff7fb;
    --brass: #8d6a1f; --moss: #3f7a3b; --good: #2f7a45; --warn: #9a6a07; --danger: #b13f30;
    --shadow: 0 10px 30px rgba(40,30,50,.12); --stroke-art: rgba(38,30,44,.45);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceee4; --surface: #f8f8f2; --surface-2: #e2e6d8; --line: #cdd2c0;
  --fg: #261e2c; --muted: #655c6c; --accent: #9b3f76; --accent-ink: #fff7fb;
  --brass: #8d6a1f; --moss: #3f7a3b; --good: #2f7a45; --warn: #9a6a07; --danger: #b13f30;
  --shadow: 0 10px 30px rgba(40,30,50,.12); --stroke-art: rgba(38,30,44,.45);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.latin { font-family: var(--font-display); font-style: italic; color: var(--muted); }
.label {
  font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.brand-name { font-family: var(--font-display); font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.page-title { font-family: var(--font-display); font-size: 1.25rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--fg);
}
.icon-btn:hover { background: var(--surface); }
.icon-btn svg { width: 22px; height: 22px; }
main {
  flex: 1;
  padding-top: 18px;
  padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: .72rem; letter-spacing: .02em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* ---------- generic pieces ---------- */
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.card.tap { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.card.tap:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 620px) { .grid2.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); cursor: pointer; font-weight: 600; font-size: .95rem; text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .85rem; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; font-size: .84rem; cursor: pointer; white-space: nowrap; color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.static { cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -2px; }
.chips.scroll::-webkit-scrollbar { display: none; }

.ev {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .68rem;
  letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap;
}
.ev::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ev-good { color: var(--good); }
.ev-some { color: var(--moss); }
.ev-limited { color: var(--warn); }
.ev-folk { color: var(--brass); }
.ev-none { color: var(--danger); }
.ev-food { color: var(--muted); }

.callout {
  border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 9%, var(--surface));
  border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: .92rem;
}
.callout.danger { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--surface)); }
.callout.info { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.callout strong { display: block; margin-bottom: 2px; }

.list-plain { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 6px; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 12px; }
ol.steps li { counter-increment: step; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
ol.steps li::before {
  content: counter(step); font-family: var(--font-display); font-size: 1.1rem; color: var(--accent);
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center;
}
.ingredients { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ingredients label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.ingredients input { margin-top: 4px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.ingredients input:checked + span { color: var(--muted); text-decoration: line-through; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty svg { width: 72px; height: 72px; opacity: .8; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: .85rem; color: var(--muted); font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font-size: 16px;
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.stars { display: flex; gap: 4px; }
.stars button { border: 0; background: transparent; cursor: pointer; padding: 4px; color: var(--line); font-size: 1.6rem; line-height: 1; }
.stars button.on { color: var(--brass); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { width: 46px; height: 28px; accent-color: var(--accent); }
.photo-preview { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }

/* ---------- today ---------- */
.hello h1 { font-size: 2.1rem; }
.hello .date { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.sky { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 620px) { .sky.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.moon-card { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; }
.moon-halo { fill: color-mix(in srgb, var(--brass) 10%, transparent); }
.moon-dark { fill: color-mix(in srgb, var(--fg) 8%, var(--surface)); }
.moon-lit { fill: var(--brass); }
.moon-rim { fill: none; stroke: color-mix(in srgb, var(--brass) 55%, transparent); stroke-width: 1; }
.cycle-ring { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; }
.ring-track { fill: none; stroke: var(--surface-2); stroke-width: 9; }
.ring-seg { fill: none; stroke-width: 9; }
.ring-dot { fill: var(--fg); stroke: var(--surface); stroke-width: 3; }
.ring-text { font-family: var(--font-display); fill: var(--fg); font-size: 22px; }
.ring-sub { font-family: var(--font-mono); fill: var(--muted); font-size: 8px; letter-spacing: .1em; }
.tip-card {
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 14%, var(--surface)) 0%, var(--surface) 60%);
}
.tip-text { font-family: var(--font-display); font-size: 1.22rem; line-height: 1.35; }
.task-group { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.task-group:first-of-type { border-top: 0; padding-top: 2px; }
@media (max-width: 400px) { .task-group { grid-template-columns: 1fr; gap: 6px; } }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.c-si { background: #b79be0; } .c-so { background: #7fbf86; } .c-pr { background: #e0a46d; } .c-po { background: #6fb4c8; } .c-hv { background: #e5c35a; }
.reminder { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: inherit; }
.reminder:first-child { border-top: 0; }
.pill { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.soon { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.past { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.pill.info { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.quick .btn { flex-direction: column; min-height: 76px; font-size: .82rem; gap: 6px; text-align: center; }
.quick .btn svg { width: 24px; height: 24px; color: var(--accent); }

/* ---------- herbs ---------- */
.herb-card { padding: 10px 10px 14px; gap: 4px; align-items: stretch; }
.herb-card .art-wrap { aspect-ratio: 1 / 1.05; max-width: 100%; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.herb-card .art-wrap svg { width: 88%; height: 88%; }
.herb-card .art-wrap img { width: 100%; height: 100%; object-fit: cover; }
.herb-card h3 { font-size: 1.12rem; margin-top: 6px; }
.herb-card .latin { font-size: .82rem; line-height: 1.3; }
.herb-card .now { font-size: .76rem; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.herb-art .stem { stroke: var(--stroke-art); stroke-width: 1.2; }
.herb-art .blade { stroke-width: 2.4; stroke-linecap: round; }
.herb-art .leaf path, .herb-art .leaf circle { stroke: var(--stroke-art); stroke-width: .5; }
.herb-art .vein { stroke: var(--stroke-art); stroke-width: .45; }
.herb-art .frond { stroke-width: 1; fill: none; }
.hero-art { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.hero-art .plate {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); aspect-ratio: 4 / 3; max-width: 100%;
  display: grid; place-items: center; overflow: hidden; position: relative;
}
.hero-art .plate svg { height: 92%; }
.hero-art .plate img { width: 100%; height: 100%; object-fit: cover; }
.plate-toggle { position: absolute; right: 10px; bottom: 10px; }
.specimen {
  border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; background: var(--surface);
  font-family: var(--font-mono); font-size: .78rem; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
  position: relative;
}
.specimen::before { content: attr(data-label); text-transform: uppercase; position: absolute; top: -9px; left: 12px; background: var(--bg); padding: 0 6px; font-size: .62rem; letter-spacing: .16em; color: var(--muted); }
.specimen dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .68rem; padding-top: 2px; }
.specimen dd { margin: 0; color: var(--fg); }
.calstrip-wrap { overflow-x: auto; }
.calstrip { display: grid; grid-template-columns: 110px repeat(12, minmax(20px, 1fr)); gap: 3px; align-items: center; min-width: 380px; font-size: .78rem; }
.calstrip .m { text-align: center; font-family: var(--font-mono); font-size: .62rem; color: var(--muted); }
.calstrip .m.now { color: var(--accent); font-weight: 700; }
.calstrip .lbl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calstrip .cell { height: 14px; border-radius: 3px; background: var(--surface-2); }
.calstrip .cell.now { box-shadow: 0 0 0 1px var(--accent); }
.use-item { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.use-item:first-child { border-top: 0; padding-top: 0; }
.yeartable-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.year { border-collapse: collapse; min-width: 640px; width: 100%; font-size: .8rem; }
table.year th, table.year td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; }
table.year th:first-child, table.year td:first-child { text-align: left; padding-left: 12px; position: sticky; left: 0; background: var(--surface); white-space: nowrap; }
table.year th { font-family: var(--font-mono); font-weight: 400; font-size: .64rem; color: var(--muted); }
table.year th.now { color: var(--accent); }
table.year td.now { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.dots { display: inline-flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 24px; }
.dots .dot { width: 7px; height: 7px; }

/* ---------- make ---------- */
.make-card { gap: 8px; }
.make-card h3 { font-size: 1.12rem; }
.meta-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.cat-mark { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

/* ---------- journal ---------- */
.entry { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.entry .thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); }
.entry-date { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mini-moon { width: 16px; height: 16px; vertical-align: -3px; }
.rating { color: var(--brass); letter-spacing: 2px; }
.prose { display: flex; flex-direction: column; gap: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- truths ---------- */
.myth { gap: 10px; }
.myth .claim { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.3; }
.stamp {
  align-self: flex-start; font-family: var(--font-mono); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--danger); border: 1.5px solid var(--danger); padding: 3px 8px; border-radius: 4px; transform: rotate(-2deg);
}
.instead { font-size: .92rem; padding-top: 8px; border-top: 1px dashed var(--line); }
.instead b { color: var(--moss); }
.source-link { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.source-link:first-child { border-top: 0; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,6,14,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.toast-zone {
  position: fixed; left: 0; right: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.toast {
  pointer-events: auto; max-width: 520px; width: 100%; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: flex-start; animation: rise .22s ease-out;
}
.toast .tip-text { font-size: 1.02rem; }
.toast button { flex: none; }
.banner { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: .88rem; }
textarea.code { font-family: var(--font-mono); font-size: 12px; min-height: 140px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============================================================
   HEDGE & MOON — botanical illustrations & moon drawing
   Every herb is drawn from its art recipe, seeded by its id,
   so each plant looks the same every time it's drawn.

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const f1 = n => Math.round(n * 10) / 10;

function qPoint(p0, p1, p2, t) {
  const u = 1 - t;
  return [u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]];
}
function qTangent(p0, p1, p2, t) {
  return [2*(1-t)*(p1[0]-p0[0]) + 2*t*(p2[0]-p1[0]), 2*(1-t)*(p1[1]-p0[1]) + 2*t*(p2[1]-p1[1])];
}

function leafShape(kind, r) {
  // drawn pointing along +x from the origin
  switch (kind) {
    case "needle": { const L = 12 + r()*4, W = 1.6; return `<path d="M0,0 Q${f1(L/2)},${-W} ${f1(L)},0 Q${f1(L/2)},${W} 0,0Z"/>`; }
    case "tiny":   { const L = 5 + r()*2, W = 2.6; return `<path d="M0,0 Q${f1(L/2)},${-W} ${f1(L)},0 Q${f1(L/2)},${W} 0,0Z"/>`; }
    case "oval":   { const L = 15 + r()*5, W = 6 + r()*2; return `<path d="M0,0 C${f1(L*.25)},${-W} ${f1(L*.75)},${-W} ${f1(L)},0 C${f1(L*.75)},${W} ${f1(L*.25)},${W} 0,0Z"/><path d="M1,0 L${f1(L-2)},0" fill="none" class="vein"/>`; }
    case "bay":    { const L = 22 + r()*5, W = 6.5; return `<path d="M0,0 C${f1(L*.3)},${-W} ${f1(L*.7)},${-W*.8} ${f1(L)},0 C${f1(L*.7)},${W*.8} ${f1(L*.3)},${W} 0,0Z"/><path d="M1,0 L${f1(L-2)},0" fill="none" class="vein"/>`; }
    case "serrated": {
      const L = 15 + r()*4, W = 7, n = 6; let top = "M0,0";
      for (let i = 1; i <= n; i++) {
        const x = L * i / n, w = W * Math.sin(Math.PI * i / n) * 0.95 + 0.4;
        const xm = L * (i - 0.5) / n, wm = W * Math.sin(Math.PI * (i - .5) / n) * 0.75;
        top += ` L${f1(xm)},${f1(-wm)} L${f1(x)},${f1(-w)}`;
      }
      // rebuild bottom edge returning to origin
      let back = "";
      for (let i = n; i >= 1; i--) {
        const x = L * (i - 1) / n, w = i - 1 === 0 ? 0 : W * Math.sin(Math.PI * (i - 1) / n) * 0.95 + 0.4;
        const xm = L * (i - 0.5) / n, wm = W * Math.sin(Math.PI * (i - .5) / n) * 0.75;
        back += ` L${f1(xm)},${f1(wm)} L${f1(x)},${f1(w)}`;
      }
      return `<path d="${top} L${f1(L)},0${back}Z"/><path d="M1,0 L${f1(L-3)},0" fill="none" class="vein"/>`;
    }
    case "lobed": {
      const L = 9 + r()*3;
      let s = "";
      [-38, 0, 38].forEach(a => {
        s += `<g transform="rotate(${a})"><path d="M0,0 C${f1(L*.3)},-4.5 ${f1(L*.8)},-4.5 ${f1(L)},0 C${f1(L*.8)},4.5 ${f1(L*.3)},4.5 0,0Z"/></g>`;
      });
      return `<g transform="translate(3,0)">${s}</g><path d="M0,0 L3,0" fill="none"/>`;
    }
    case "feathery": {
      const L = 16 + r()*4; let s = `<path d="M0,0 L${f1(L)},0" fill="none" class="frond"/>`;
      for (let i = 1; i < 6; i++) {
        const x = L * i / 6, l = 5 * (1 - i / 7);
        s += `<path d="M${f1(x)},0 l${f1(l*.8)},${f1(-l)} M${f1(x)},0 l${f1(l*.8)},${f1(l)}" fill="none" class="frond"/>`;
      }
      return s;
    }
    case "round": {
      const R = 7 + r()*3;
      let s = `<path d="M0,0 L${f1(R*.9)},0" fill="none" class="frond"/><circle cx="${f1(R*1.9)}" cy="0" r="${f1(R)}"/>`;
      for (let a = 0; a < 360; a += 45) {
        const rad = a * Math.PI / 180;

function flowerShape(kind, fc, cc, r) {
  switch (kind) {
    case "spike": {
      let s = "";
      for (let i = 0; i < 8; i++) {
        const y = -i * 3.4, w = 3.2 - i * 0.25;
        s += `<ellipse cx="${f1(-w*.6)}" cy="${f1(y)}" rx="${f1(w*.75)}" ry="2.1" fill="${fc}"/><ellipse cx="${f1(w*.6)}" cy="${f1(y-1.5)}" rx="${f1(w*.75)}" ry="2.1" fill="${fc}"/>`;
      }
      return s;
    }
    case "globe": {
      let s = "";
      for (let i = 0; i < 14; i++) {
        const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 6;
        s += `<circle cx="${f1(Math.cos(a)*d)}" cy="${f1(Math.sin(a)*d - 5)}" r="${f1(1.8 + r()*1.2)}" fill="${fc}"/>`;
      }
      return s;
    }
    case "umbel": {
      let s = "";
      for (let i = 0; i < 9; i++) {
        const a = (-150 + i * 15) * Math.PI / 180, l = 11 + r()*3;
        const x = Math.cos(a) * l, y = Math.sin(a) * l;
        s += `<path d="M0,0 L${f1(x)},${f1(y)}" fill="none" class="frond"/>`;
        for (let j = 0; j < 4; j++) s += `<circle cx="${f1(x + (r()-.5)*4)}" cy="${f1(y + (r()-.5)*3 - 1)}" r="1.2" fill="${fc}"/>`;
      }
      return s;
    }
    case "daisy": {
      let s = ""; const n = 13, R = 7.5;
      for (let i = 0; i < n; i++) {
        const a = i * 360 / n;
        s += `<g transform="rotate(${f1(a)})"><ellipse cx="${f1(R*.62)}" cy="0" rx="${f1(R*.55)}" ry="1.9" fill="${fc}"/></g>`;
      }
      return s + `<circle cx="0" cy="0" r="3.1" fill="${cc}"/>`;
    }
    case "trumpet": {
      let s = "";
      for (let i = 0; i < 5; i++) {
        const a = i * 72 - 90;
        s += `<g transform="rotate(${a})"><ellipse cx="4.6" cy="0" rx="4.8" ry="3.6" fill="${fc}"/></g>`;
      }
      return s + `<circle cx="0" cy="0" r="1.8" fill="#f5c542"/>`;
    }
  }

}

function herbArt(herb, opts) {
  const o = opts || {};
  const a = herb.art, r = rng(hashStr(herb.id));
  const cc = a.cc || (a.fc === "#d872a6" ? "#8a4a2b" : a.fc === "#f39a2b" ? "#b8561a" : "#e3b23c");
  let body = "", flowers = "";
  const base = [60, 138];

  if (a.leaf === "grass") {
    const n = 9;
    for (let i = 0; i < n; i++) {
      const ex = 60 + (i - (n-1)/2) * 6 + (r()-.5)*4, ey = 30 + r()*30;
      const cx = 60 + (i - (n-1)/2) * 2.5, cy = 90;
      body += `<path d="M${f1(58 + i*0.5)},138 Q${f1(cx)},${cy} ${f1(ex)},${f1(ey)}" fill="none" class="blade" stroke="${a.lc}"/>`;
      if (a.flower !== "none" && i % 3 === 1) {
        flowers += `<g transform="translate(${f1(ex)},${f1(ey)})">${flowerShape(a.flower, a.fc, cc, r)}</g>`;
      }
    }
  } else {
    const stems = a.leaf === "tiny" ? 5 : a.leaf === "round" ? 4 : 3;
    for (let s = 0; s < stems; s++) {
      const spread = (s - (stems - 1) / 2);
      const p0 = [base[0] + spread * 3, base[1]];
      const p2 = [60 + spread * 26 + (r() - .5) * 10, 34 + r() * 22 + Math.abs(spread) * 8];
      const p1 = [60 + spread * 6 + (r() - .5) * 14, 92];
      body += `<path d="M${f1(p0[0])},${f1(p0[1])} Q${f1(p1[0])},${f1(p1[1])} ${f1(p2[0])},${f1(p2[1])}" fill="none" class="stem"/>`;
      const count = a.leaf === "tiny" ? 14 : a.leaf === "needle" ? 16 : a.leaf === "round" ? 3 : a.leaf === "bay" ? 5 : 6;
      for (let i = 0; i < count; i++) {
        const t = 0.18 + (i / count) * 0.74;
        const p = qPoint(p0, p1, p2, t), tg = qTangent(p0, p1, p2, t);
        const ang = Math.atan2(tg[1], tg[0]) * 180 / Math.PI;
        const side = i % 2 === 0 ? 1 : -1;
        const off = a.leaf === "round" ? 70 : a.leaf === "needle" ? 38 : 48;
        const scale = 1 - t * 0.35;
        body += `<g transform="translate(${f1(p[0])},${f1(p[1])}) rotate(${f1(ang + side * off)}) scale(${f1(scale)})" class="leaf" fill="${a.lc}">${leafShape(a.leaf, r)}</g>`;
      }
      if (a.flower !== "none") {
        const tg = qTangent(p0, p1, p2, 1);
        const ang = Math.atan2(tg[1], tg[0]) * 180 / Math.PI + 90;
        flowers += `<g transform="translate(${f1(p2[0])},${f1(p2[1])}) rotate(${a.flower === "spike" ? f1(ang) : 0})">${flowerShape(a.flower, a.fc, cc, r)}</g>`;
      }
    }
  }
  const cls = o.cls ? ` class="${o.cls}"` : "";
  body = body.split('class="frond"').join(`class="frond" style="stroke:${a.lc}"`);
  flowers = flowers.split('class="frond"').join(`class="frond" style="stroke:${a.lc}"`);
  return `<svg${cls} viewBox="0 0 120 145" role="img" aria-label="Illustration of ${herb.name}" xmlns="http://www.w3.org/2000/svg"><g class="herb-art">${body}${flowers}</g></svg>`;
}

/* ---------- MOON ---------- */
const SYNODIC = 29.530588853;
const KNOWN_NEW = Date.UTC(2000, 0, 6, 18, 14, 0); // reference new moon

function moonInfo(date) {
  const d = date || new Date();
  const days = (d.getTime() - KNOWN_NEW) / 86400000;
  let age = days % SYNODIC; if (age < 0) age += SYNODIC;
  const frac = age / SYNODIC;
  const illum = (1 - Math.cos(2 * Math.PI * frac)) / 2;
  let name;
  if (age < 1.0 || age > SYNODIC - 1.0) name = "New Moon";
  else if (age < 6.38) name = "Waxing Crescent";
  else if (age < 8.38) name = "First Quarter";
  else if (age < 13.77) name = "Waxing Gibbous";
  else if (age < 15.77) name = "Full Moon";
  else if (age < 21.15) name = "Waning Gibbous";
  else if (age < 23.15) name = "Last Quarter";
  else name = "Waning Crescent";
  const toFull = ((SYNODIC / 2 - age) + SYNODIC) % SYNODIC;
  const toNew = SYNODIC - age;
  return {
    age, frac, illum, name,
    nextFull: new Date(d.getTime() + toFull * 86400000),
    nextNew: new Date(d.getTime() + toNew * 86400000)
  };
}

function moonSVG(frac, size, label) {
  const R = 40, cx = 50, cy = 50;
  const illum = (1 - Math.cos(2 * Math.PI * frac)) / 2;
  const waxing = frac < 0.5;
  const rx = f1(Math.abs(Math.cos(2 * Math.PI * frac)) * R);
  const gibbous = illum > 0.5;
  let path;
  if (illum < 0.02) path = "";
  else if (illum > 0.98) path = `<circle cx="${cx}" cy="${cy}" r="${R}" class="moon-lit"/>`;
  else {
    const outerSweep = waxing ? 1 : 0;
    const innerSweep = waxing ? (gibbous ? 1 : 0) : (gibbous ? 0 : 1);
    path = `<path class="moon-lit" d="M${cx},${cy - R} A${R},${R} 0 0 ${outerSweep} ${cx},${cy + R} A${rx},${R} 0 0 ${innerSweep} ${cx},${cy - R}Z"/>`;
  }
  return `<svg class="moon" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${label || "Moon phase"}"><circle cx="${cx}" cy="${cy}" r="${R + 6}" class="moon-halo"/><circle cx="${cx}" cy="${cy}" r="${R}" class="moon-dark"/>${path}<circle cx="${cx}" cy="${cy}" r="${R}" class="moon-rim"/></svg>`;
}

/* ============================================================
   HEDGE & MOON — app
   Data lives in IndexedDB on this device only.
   UPGRADE RULES (for whoever edits this next):
   1. Never delete or rename an object store. Only add new ones
      in a new DB_UPGRADES step and bump DB_VERSION.
   2. When the shape of saved records changes, bump
      SCHEMA_VERSION and add a DATA_UPGRADES step that fills in
      or converts the old records. Old fields are never removed.
   3. Bump APP_VERSION (and CACHE in sw.js) for every release.
   ============================================================ */
"use strict";

const APP_VERSION = "1.0.0";
const SCHEMA_VERSION = 1;
const DB_NAME = "hedge-and-moon";
const DB_VERSION = 1;

const DB_UPGRADES = {
  1(db) {
    db.createObjectStore("meta", { keyPath: "key" });
    db.createObjectStore("journal", { keyPath: "id" });
    db.createObjectStore("inventory", { keyPath: "id" });
    db.createObjectStore("creations", { keyPath: "id" });
  }
};
const DATA_UPGRADES = {
  // 2: (data) => { data.journal.forEach(e => { if (e.mood === undefined) e.mood = ""; }); }
};

/* ---------------- storage ---------------- */
const Store = {
  db: null, memory: false,
  mem: { meta: new Map(), journal: new Map(), inventory: new Map(), creations: new Map() },
  async open() {
    if (!("indexedDB" in window)) { this.memory = true; return; }
    try {
      this.db = await Promise.race([
        new Promise((res, rej) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = req.result;
            for (let v = e.oldVersion + 1; v <= DB_VERSION; v++) if (DB_UPGRADES[v]) DB_UPGRADES[v](db, req.transaction);
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
          req.onblocked = () => rej(new Error("Database blocked by another open copy of the app"));
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("Storage timed out")), 4000))
      ]);
      this.db.onversionchange = () => { try { this.db.close(); } catch (e) {} location.reload(); };
    } catch (e) {
      console.warn("Storage unavailable, using memory only:", e);
      this.memory = true;
    }
  },
  keyOf(store, v) { return store === "meta" ? v.key : v.id; },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && r.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  async all(store) {
    if (this.memory) return [...this.mem[store].values()];
    return (await this._req(store, "readonly", s => s.getAll())) || [];
  },
  async put(store, val) {
    if (this.memory) { this.mem[store].set(this.keyOf(store, val), val); return; }
    try { await this._req(store, "readwrite", s => s.put(val)); }
    catch (e) { toast(`<div><b>Couldn't save.</b> ${esc(e && e.message || "Storage error")}. Try freeing up space on your phone.</div>`); throw e; }
  },
  async del(store, key) {
    if (this.memory) { this.mem[store].delete(key); return; }
    await this._req(store, "readwrite", s => s.delete(key));
  }
};

  const per = Math.max(2, Math.min(10, +c.period || 5));

  return { day, len, per, ov, phase, next, stale: diff >= len + 7, diff };

  const ang = ((cs.day - 0.5) / L) * Math.PI * 2 - Math.PI / 2;
  const dx = 50 + Math.cos(ang) * r, dy = 50 + Math.sin(ang) * r;
  return `<svg width="92" height="92" viewBox="0 0 100 100" role="img" aria-label="Cycle day ${cs.day} of ${L}"><circle class="ring-track" cx="50" cy="50" r="${r}"/>${arcs}<circle class="ring-dot" cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="5.5"/><text class="ring-text" x="50" y="55" text-anchor="middle">${cs.day}</text><text class="ring-sub" x="50" y="68" text-anchor="middle">DAY</text></svg>`;
}

/* ---------------- tips ---------------- */
function tipSlot(d) { const n = d || new Date(); return `${todayISO()}-${Math.floor(n.getHours() / 3)}`; }
function tipFor(slot, offset) { return TIPS[(hashStr(slot) + (offset || 0)) % TIPS.length]; }
async function maybeShowTip() {
  if (!S.settings.onboarded || !S.settings.tips) return;
  const slot = tipSlot();
  if (S.settings.lastTipSlot === slot) return;
  S.settings.lastTipSlot = slot; await saveSettings();
  setTimeout(() => toast(`<div class="stack" style="gap:4px"><span class="label">Herb note</span><div class="tip-text">${esc(tipFor(slot, 11))}</div></div>`, { timeout: 12000, keep: true }), 1200);
}

/* ---------------- overlays ---------------- */
function toast(html, opts) {
  const o = opts || {};
  const zone = document.getElementById("toasts");
  if (!o.keep) zone.querySelectorAll(".toast:not([data-keep])").forEach(t => t.remove());
  const el = document.createElement("div");
  if (o.keep) el.dataset.keep = "1";
  el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = `<div style="flex:1;min-width:0">${html}</div><button class="icon-btn" aria-label="Dismiss" style="width:32px;height:32px">${icon("close")}</button>`;
  el.querySelector("button").onclick = () => el.remove();
  zone.appendChild(el);
  setTimeout(() => el.remove(), o.timeout || 2800);
}
function openSheet(html) {
  closeSheet();
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener("click", e => { if (e.target === scrim && !scrim.dataset.locked) closeSheet(); });
  document.body.appendChild(scrim);
  return scrim.querySelector(".sheet");
}
function closeSheet() { const s = document.getElementById("scrim"); if (s) s.remove(); }
function confirmSheet(title, body, okLabel, danger) {
  return new Promise(resolve => {
    const sh = openSheet(`<h2>${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="btn-row"><button class="btn ghost" data-r="0">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-r="1">${esc(okLabel)}</button></div>`);
    sh.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { closeSheet(); resolve(b.dataset.r === "1"); });
  });
}

/* ---------------- theme ---------------- */
function applyTheme() {
  const t = S.settings.theme, root = document.documentElement;
  if (t === "night") root.setAttribute("data-theme", "dark");
  else if (t === "day") root.setAttribute("data-theme", "light");
  else root.removeAttribute("data-theme");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", getComputedStyle(root).getPropertyValue("--bg").trim() || "#16131c");
}

function go(name, params, opts) {
  const o = opts || {};
  if (o.tab) S.stack = [];
  else if (!o.replace) S.stack.push(S.view);
  S.view = { name, params: params || {} };

function back() {

  const v = VIEWS[S.view.name] || VIEWS.today;

  if (v.after) v.after(p);
  if (scrollTop) window.scrollTo(0, 0);
}

function storeStatus(it) {
  const out = [];
  if (it.bestBefore) {
    const d = daysUntil(it.bestBefore);
    if (d < 0) out.push({ cls: "past", text: "Past its best", rank: 0 });
    else if (d <= 14) out.push({ cls: "soon", text: d === 0 ? "Use today" : `Use within ${d}d`, rank: 1 });
  }
  if (it.nextHarvest) {
    const d = daysUntil(it.nextHarvest);
    if (d <= 0) out.push({ cls: "info", text: "Harvest due", rank: 1 });
    else if (d <= 7) out.push({ cls: "info", text: `Harvest in ${d}d`, rank: 2 });
  }
  return out;
}

function herbMatches(h) {
  const q = S.herbQuery.trim().toLowerCase();
  if (q && !(h.name + " " + h.latin + " " + h.family).toLowerCase().includes(q)) return false;
  const m = new Date().getMonth() + 1;
  switch (S.herbFilter) {
    case "full": return h.sun.includes("full");
    case "part": return h.sun.includes("part");
    case "pots": return h.container;
    case "now": return CAL_KEYS.some(k => (h.cal[k.key] || []).includes(m));
  }
  return true;
}

/* ============================================================
   SHARING
   ============================================================ */
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const SHARE_PREFIX = "HEDGE1:";
const clip = (v, n) => String(v == null ? "" : v).slice(0, n);
function cleanMake(d) {
  const arr = (a, n) => Array.isArray(a) ? a.slice(0, 60).map(x => clip(x, n)) : [];
  return {
    title: clip(d.title, 120) || "Shared recipe", cat: CATS[d.cat] && d.cat !== "mine" ? d.cat : "kitchen", time: clip(d.time, 60),
    herbs: arr(d.herbs, 30).filter(id => HERB[id]), pantry: arr(d.pantry, 30).filter(id => PANT[id]),
    ingredients: arr(d.ingredients, 300), steps: arr(d.steps, 800), keeps: clip(d.keeps, 400), safety: clip(d.safety, 600), evnote: clip(d.evnote, 1200)
  };
}
function cleanJournal(d) {
  return {
    title: clip(d.title, 160) || "Shared entry", type: J_TYPES.includes(d.type) ? d.type : "Experiment", date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : todayISO(),
    herbs: Array.isArray(d.herbs) ? d.herbs.filter(id => HERB[id] || PANT[id]).slice(0, 40) : [], did: clip(d.did, 4000), result: clip(d.result, 4000),
    rating: Math.max(0, Math.min(5, parseInt(d.rating, 10) || 0)), again: clip(d.again, 40)
  };
}
function readableMake(m) {
  return [m.title.toUpperCase(), m.time ? `Time: ${m.time}` : "",
    (m.ingredients || []).length ? "\nYou'll need:\n" + m.ingredients.map(i => "• " + i).join("\n") : "",
    (m.steps || []).length ? "\nMethod:\n" + m.steps.map((s, i) => `${i + 1}. ${s}`).join("\n") : "",
    m.keeps ? `\nKeeps: ${m.keeps}` : "", m.safety ? `Safety: ${m.safety}` : ""].filter(Boolean).join("\n");
}
async function shareText(title, text) {
  if (navigator.share && !inIframe()) {
    try { await navigator.share({ title, text }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch (e) {}
  const sh = openSheet(`<h2>${copied ? "Copied" : "Copy this message"}</h2>
    <p class="small muted">${copied ? "The share is on your clipboard. Paste it into Messages, WhatsApp or email. Your friend copies the whole message and pastes it into Receive in their app." : "Select all the text below, copy it, and send it to your friend. They paste it into Receive in their app."}</p>
    <textarea class="input code" readonly id="share-out"></textarea>
    <button class="btn primary block" data-close>Done</button>`);
  const ta = sh.querySelector("#share-out"); ta.value = text;
  if (!copied) { ta.focus(); ta.select(); }
  sh.querySelector("[data-close]").onclick = closeSheet;
}
async function shareMake(id, mine) {
  const mk = mine ? S.creations.find(c => c.id === id) : MAKE[id]; if (!mk) return;
  const data = cleanMake(mk);
  const payload = { k: "make", from: clip(S.settings.name, 40), d: data };
  const text = `🌿 ${data.title}, shared from Hedge & Moon\n\n${readableMake(data)}\n\nTo add it to your app: copy this whole message, open Hedge & Moon, tap Receive and paste.\n${SHARE_PREFIX}${b64urlEncode(JSON.stringify(payload))}`;
  await shareText(data.title, text);
}
async function shareJournal(id) {
  const e = S.journal.find(x => x.id === id); if (!e) return;
  const data = cleanJournal(e); // photo and cycle phase deliberately left out
  const payload = { k: "journal", from: clip(S.settings.name, 40), d: data };
  const text = `🌙 ${data.title}, from my Hedge & Moon journal\n\n${data.did ? "What I did: " + data.did + "\n" : ""}${data.result ? "How it went: " + data.result + "\n" : ""}${data.rating ? "★".repeat(data.rating) + "\n" : ""}\nTo save it in your app: copy this whole message, open Hedge & Moon, tap Receive and paste.\n${SHARE_PREFIX}${b64urlEncode(JSON.stringify(payload))}`;
  await shareText(data.title, text);
}
function parseShare(text) {
  const m = String(text || "").match(/HEDGE1:([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("No share code found. Make sure you copied the whole message, including the line starting HEDGE1:");
  let obj;
  try { obj = JSON.parse(b64urlDecode(m[1])); } catch (e) { throw new Error("The code looks cut off or changed. Ask your friend to share it again."); }
  if (!obj || (obj.k !== "make" && obj.k !== "journal") || typeof obj.d !== "object") throw new Error("This isn't a Hedge & Moon share code.");
  return { kind: obj.k, from: clip(obj.from, 40), data: obj.k === "make" ? cleanMake(obj.d) : cleanJournal(obj.d) };
}

/* ============================================================
   BACKUP
   ============================================================ */
function backupJSON() {
  return JSON.stringify({ app: "hedge-and-moon", appVersion: APP_VERSION, schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(),
    settings: S.settings, photos: S.photos, journal: S.journal, inventory: S.inventory, creations: S.creations });
}
async function restoreBackup(text) {
  let b;
  try { b = JSON.parse(text.trim()); } catch (e) { throw new Error("That doesn't look like a backup. Copy or choose the whole backup file."); }
  if (!b || b.app !== "hedge-and-moon") throw new Error("That isn't a Hedge & Moon backup.");
  if ((b.schema || 1) > SCHEMA_VERSION) throw new Error("This backup is from a newer version of the app. Update the app first, then restore.");
  const data = { journal: b.journal || [], inventory: b.inventory || [], creations: b.creations || [], settings: b.settings || {} };
  for (let v = (b.schema || 1) + 1; v <= SCHEMA_VERSION; v++) if (DATA_UPGRADES[v]) DATA_UPGRADES[v](data);
  let added = 0, updated = 0;
  for (const store of ["journal", "inventory", "creations"]) {
    for (const rec of data[store]) {
      if (!rec || typeof rec.id !== "string") continue;
      const cur = S[store].find(x => x.id === rec.id);
      if (!cur) { S[store].push(rec); await Store.put(store, rec); added++; }
      else if ((rec.updatedAt || 0) > (cur.updatedAt || 0)) { Object.assign(cur, rec); await Store.put(store, cur); updated++; }
    }
  }
  if (b.photos) { for (const k in b.photos) if (!S.photos[k] && HERB[k]) S.photos[k] = b.photos[k]; await savePhotos(); }
  const s = data.settings;
  if (!S.settings.name && s.name) S.settings.name = clip(s.name, 40);
  if (!S.settings.cycle.lastStart && s.cycle && s.cycle.lastStart) S.settings.cycle = Object.assign(S.settings.cycle, s.cycle);
  S.settings.onboarded = true;
  await saveSettings();
  return { added, updated };
}

/* ============================================================
   PHOTOS
   ============================================================ */
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.74));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That image couldn't be opened. Try a JPEG or PNG.")); };
    img.src = url;
  });
}

    catch (e) {
      const sh = openSheet(`<h2>Copy your backup</h2><p class="small muted">Select all and copy, then keep it somewhere safe.</p><textarea class="input code" readonly id="bk-out"></textarea><button class="btn primary block" data-close>Done</button>`);
      const ta = sh.querySelector("#bk-out"); ta.value = txt; ta.select(); sh.querySelector("[data-close]").onclick = closeSheet;
    }
  },
  "backup-file": async () => {
    const txt = backupJSON(), name = `hedge-and-moon-backup-${todayISO()}.json`;
    try {
      const file = new File([txt], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && !inIframe()) { await navigator.share({ files: [file], title: "Hedge & Moon backup" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      const url = URL.createObjectURL(new Blob([txt], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("If no file appeared, use Copy backup instead.");
    } catch (e) { toast("Saving a file isn't allowed here. Use Copy backup instead."); }
  },
  "restore-paste": async () => {
    const t = document.getElementById("restore-text").value;
    try { const r = await restoreBackup(t); toast(`Restored: ${r.added} added, ${r.updated} updated.`); render(); }
    catch (e) { toast(esc(e.message)); }
  },
  "recv-read": () => {
    const box = document.getElementById("recv-preview");
    try {
      const sh = parseShare(document.getElementById("recv-text").value);
      S.pendingShare = sh;
      const d = sh.data;
      box.innerHTML = `<div class="card"><span class="label">${sh.kind === "make" ? "Recipe or method" : "Journal entry"}${sh.from ? ` from ${esc(sh.from)}` : ""}</span><h2>${esc(d.title)}</h2>
        ${sh.kind === "make" ? `<p class="small muted">${(d.ingredients || []).length} ingredients · ${(d.steps || []).length} steps${d.time ? " · " + esc(d.time) : ""}</p>` : `<p class="small muted">${esc(fmtDateY(d.date))}${d.rating ? " · " + "★".repeat(d.rating) : ""}</p>`}
        <p class="small">Herbs and ideas from friends are a lovely way to learn. Check anything health-related against Herb truths before you try it.</p>
        <button class="btn primary" data-act="recv-save">${sh.kind === "make" ? "Save to My makes" : "Save to my journal"}</button></div>`;
    } catch (e) { box.innerHTML = `<div class="callout danger">${esc(e.message)}</div>`; }
  },
  "recv-save": async () => {
    const sh = S.pendingShare; if (!sh) return;
    const now = Date.now();
    if (sh.kind === "make") {
      const rec = { ...sh.data, id: uid(), from: sh.from || "a friend", createdAt: now, updatedAt: now };
      S.creations.push(rec); await Store.put("creations", rec);
      S.pendingShare = null; S.makeCat = "mine"; toast("Saved to My makes."); go("makeDetail", { id: rec.id, mine: true }, { replace: true });
    } else {
      const d = sh.data;
      const rec = { ...d, id: uid(), title: d.title + (sh.from ? ` (from ${sh.from})` : ""), moon: moonInfo(parseISO(d.date)).name, cycle: "", createdAt: now, updatedAt: now };
      S.journal.push(rec); await Store.put("journal", rec);
      S.pendingShare = null; toast("Saved to your journal."); go("journalView", { id: rec.id }, { replace: true });
    }
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = ACTIONS[el.dataset.act];
  if (!a) return;
  if (el.tagName === "A" || el.type === "submit") e.preventDefault();
  if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault();
  a(el.dataset, el);
});

document.addEventListener("change", async e => {
  const t = e.target;
  // photos
  if (t.matches("input[type=file][data-photo]")) {
    const file = t.files && t.files[0]; if (!file) return;
    try {
      const data = await resizeImage(file, 1100);
      if (t.dataset.photo === "herb") { S.photos[t.dataset.id] = data; await savePhotos(); S.view.params.showPhoto = true; render(); toast("Photo saved."); }
      else {
        const f = t.closest(".field"); f.querySelector('input[name="photo"]').value = data;
        const im = f.querySelector("[data-preview]"); im.src = data; im.hidden = false;
      }
    } catch (err) { toast(esc(err.message)); }
    t.value = "";
    return;
  }
  if (t.matches("input[type=file][data-restore-file]")) {
    const file = t.files && t.files[0]; if (!file) return;
    try { const r = await restoreBackup(await file.text()); toast(`Restored: ${r.added} added, ${r.updated} updated.`); render(); }
    catch (err) { toast(esc(err.message)); }
    t.value = ""; return;
  }
  // store form reactions
  const form = t.closest('form[data-form="store"]');
  if (form) {
    if (t.name === "herb") form.querySelector("[data-custom]").hidden = t.value !== "";
    if (t.name === "form" || t.name === "stored") {
      const formSel = form.querySelector('[name="form"]').value;
      const bb = form.querySelector('input[name="bestBefore"]'), days = shelfDays(formSel), st = form.querySelector('[name="stored"]').value;
      const hint = form.querySelector("#sf-hint");
      if (hint) hint.textContent = days ? `Suggested shelf life for ${formSel.toLowerCase()}: about ${days >= 60 ? Math.round(days / 30) + " months" : days + " days"}.` : "No set shelf life for this form.";
      if (bb.dataset.auto === "1") bb.value = days && st ? addDays(st, days) : "";
    }
    if (t.name === "bestBefore") t.dataset.auto = "0";
  }
});

document.addEventListener("submit", async e => {
  const form = e.target; if (!form.dataset.form) return;
  e.preventDefault();
  const fd = new FormData(form), get = k => (fd.get(k) || "").toString().trim();
  const now = Date.now();
  switch (form.dataset.form) {
    case "journal": {
      const id = form.dataset.id;
      const date = get("date") || todayISO();
      const cs = cycleState(date);
      const existing = id ? S.journal.find(x => x.id === id) : null;
      const rec = Object.assign(existing || { id: uid(), createdAt: now, makeId: form.dataset.make || "", makeMine: form.dataset.mine === "1" }, {
        date, type: get("type"), title: get("title"), herbs: pickerValues(form, "herbs"), did: get("did"), result: get("result"),
        rating: +get("rating") || 0, again: get("again"), photo: get("photo"), moon: moonInfo(parseISO(date)).name,
        cycle: cs ? cs.phase : (existing ? existing.cycle : ""), updatedAt: now
      });
      if (!existing) S.journal.push(rec);
      await Store.put("journal", rec);
      toast("Entry saved.");
      go("journalView", { id: rec.id }, { replace: true });
      break;
    }
    case "creation": {
      const id = form.dataset.id;
      const picked = pickerValues(form, "herbs");
      const lines = k => get(k).split("\n").map(s => s.trim()).filter(Boolean);
      const existing = id ? S.creations.find(x => x.id === id) : null;
      const rec = Object.assign(existing || { id: uid(), createdAt: now, from: "" }, {
        title: get("title"), cat: get("cat"), time: get("time"), herbs: picked.filter(x => HERB[x]), pantry: picked.filter(x => PANT[x]),
        ingredients: lines("ingredients"), steps: lines("steps"), keeps: get("keeps"), safety: get("safety"), evnote: get("evnote"), updatedAt: now
      });
      if (!existing) S.creations.push(rec);
      await Store.put("creations", rec);
      S.makeCat = "mine"; toast("Saved to My makes.");
      go("makeDetail", { id: rec.id, mine: true }, { replace: true });
      break;
    }
    case "store": {
      const id = form.dataset.id;
      const herb = get("herb");
      if (!herb && !get("custom")) { toast("Give it a name, or pick a herb from the list."); return; }
      const existing = id ? S.inventory.find(x => x.id === id) : null;
      const rec = Object.assign(existing || { id: uid(), createdAt: now, uses: [] }, {
        herb, custom: herb ? "" : get("custom"), form: get("form"), amount: get("amount"), location: get("location"),
        stored: get("stored"), bestBefore: get("bestBefore"), nextHarvest: get("nextHarvest"), notes: get("notes"), photo: get("photo"), updatedAt: now
      });
      if (!existing) S.inventory.push(rec);
      await Store.put("inventory", rec);
      toast("Saved to stores.");
      go("storeView", { id: rec.id }, { replace: true });
      break;
    }
    case "use": {
      const it = S.inventory.find(x => x.id === form.dataset.id); if (!it) return;
      it.uses = [...(it.uses || []), { id: uid(), date: get("date") || todayISO(), purpose: get("purpose"), note: get("note") }];
      it.updatedAt = now;
      await Store.put("inventory", it); toast("Use logged."); render();
      break;
    }
    case "settings": {
      const s = S.settings;
      s.name = clip(get("name"), 40); s.profile = get("profile") === "male" ? "male" : "female";
      s.theme = ["night", "day", "system"].includes(get("theme")) ? get("theme") : "night";
      s.tips = !!fd.get("tips");
      if (get("lastStart") !== s.cycle.lastStart && s.cycle.lastStart && get("lastStart")) s.cycle.history = [...(s.cycle.history || []), s.cycle.lastStart].slice(-24);
      s.cycle.lastStart = get("lastStart");
      s.cycle.length = Math.max(20, Math.min(45, parseInt(get("length"), 10) || 28));
      s.cycle.period = Math.max(2, Math.min(10, parseInt(get("period"), 10) || 5));
      await saveSettings(); applyTheme(); toast("Settings saved."); render();
      break;
    }
    case "onboard": {
      const s = S.settings;
      s.name = clip(get("name"), 40); s.profile = get("profile") === "male" ? "male" : "female"; s.onboarded = true;
      await saveSettings(); closeSheet(); render(); maybeShowTip();
      break;
    }
  }
});

document.addEventListener("input", e => {
  if (e.target.matches('form[data-form="store"] input[name="bestBefore"]')) e.target.dataset.auto = "0";
});

/* ============================================================
   START
   ============================================================ */
function onboard() {
  const sh = openSheet(`<form class="stack" data-form="onboard" style="gap:14px">
    <div class="row" style="gap:12px">${BRAND.replace('class="brand-mark"', 'class="brand-mark" style="width:44px;height:44px"')}<h2>Welcome to Hedge &amp; Moon</h2></div>
    <p>A pocket herbal for growing, making and noticing: a UK herb calendar, recipes for one, a journal, and your stores. The health information here is evidence-checked and honest.</p>
    <label class="field"><span>What should we call you?</span><input class="input" name="name" id="ob-name" placeholder="Your name (optional)"></label>
    <div class="field"><span>Profile</span><div class="seg" role="group"><button type="button" data-act="seg" data-name="profile" data-val="female" aria-pressed="true">Female</button><button type="button" data-act="seg" data-name="profile" data-val="male" aria-pressed="false">Male</button></div>
      <input type="hidden" name="profile" value="female"><span class="small muted">Female adds menstrual cycle phases. You can change this any time in Settings.</span></div>
    <p class="small muted">Everything you add stays on this phone. Nothing is uploaded anywhere.</p>
    <button class="btn primary block" type="submit">Begin</button>
  </form>`);
  document.getElementById("scrim").dataset.locked = "1";
  return sh;
}

async function start() {
  await Store.open();
  try { await loadAll(); } catch (e) { console.warn(e); }
  applyTheme();
  render(true);
  if (!S.settings.onboarded) onboard(); else maybeShowTip();
  if (S.updated) toast(`Updated to version ${esc(APP_VERSION)}. Your journal, stores and makes are all still here.`, { timeout: 6000 });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { maybeShowTip(); if (S.view.name === "today") render(); } });
  try { if (navigator.storage && navigator.storage.persist && !Store.memory) navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator && !inIframe() && location.protocol === "https:") {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      await navigator.serviceWorker.register("sw.js");
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController) toast(`A new version is ready. <button class="btn small" onclick="location.reload()">Reload</button>`, { timeout: 15000 });
      });
    } catch (e) { console.warn("Offline support unavailable:", e); }
  }
}
start();

</script>
